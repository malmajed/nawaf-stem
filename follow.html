<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141215">
<meta property="og:title" content="تابع نواف · Nawaf's STEM Portal">
<meta property="og:description" content="تقدّم نواف في مهماته الدراسية، يتحدث تلقائياً">
<meta property="og:image" content="https://malmajed.github.io/nawaf-stem/icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>تابع نواف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Fredoka:wght@600;700&display=swap">
<style>
:root{--red:#C8102E;--red-deep:#8E0B22;--black:#141215;--ink:#1E1B1F;--bg:#F8F4F3;--card:#fff;--muted:#6E6468;--line:#E9DEDF;--gold:#D4A937;--green:#2E8B57;--shadow:0 6px 18px rgba(20,18,21,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#141215;--card:#211D21;--ink:#F4EDEE;--muted:#B4A6AA;--line:#3A3237}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Fredoka",system-ui,sans-serif;font-size:16px;line-height:1.55}
.top{background:var(--black);color:#fff;padding:14px 0}.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:0}.avatar{width:56px;height:56px;border-radius:50%;border:3px solid var(--red);object-fit:cover}
h1{font-size:1.4rem;margin:0}h1 small{display:block;font-size:.72rem;letter-spacing:.06em;color:#D9CFD2}
h2{font-size:1.15rem;margin:24px 0 8px}.note{color:var(--muted);font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.kpi b{display:block;font-size:1.8rem;color:var(--red);font-variant-numeric:tabular-nums}.kpi span{font-size:.78rem;color:var(--muted);font-weight:800}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:600px){.tracks{grid-template-columns:repeat(4,1fr)}}
.track{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.ring{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0)}.ring i{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
.track h3{font-size:.95rem;margin:0}.track p{margin:0;font-size:.78rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:6px 10px;font-size:.85rem;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}th{font-size:.75rem;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs a{width:110px;height:110px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--card)}.thumbs img{width:100%;height:100%;object-fit:cover}
.status{font-size:.8rem;color:var(--muted);margin-top:6px}.cta{display:inline-block;margin-top:10px;background:var(--red);color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:800}
.tag{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--line)}.tag.done{background:#E4F3EA;color:var(--green)}.tag.need{background:#FBE7EA;color:var(--red)}
</style>
</head>
<body>
<div class="top"><div class="wrap"><img class="avatar" src="apple-touch-icon.png" alt="نواف"><h1><small>NAWAF'S PORTAL · متابعة العائلة</small>تابع نواف 🚀</h1></div></div>
<div class="wrap">
  <p class="note" id="greet">يتم التحميل…</p>
  <div class="kpis" id="kpis"></div>
  <h2>المسارات</h2><div class="tracks" id="tracks"></div>
  <h2>الأوسمة</h2><div class="badges" id="badges"></div>
  <h2>آخر النشاط</h2><table id="log"></table>
  <h2>اختبارات المسارات</h2><table id="tests"></table>
  <h2>صور المختبر</h2><div class="thumbs" id="photos"></div>
  <p class="status" id="stat"></p>
  <p class="note">هذه صفحة للعرض فقط. تُحدَّث تلقائياً من تطبيق نواف. <br>This page is read-only and refreshes from Nawaf's app.</p>
</div>
<script>
const URL_='https://script.google.com/macros/s/AKfycbxeEUgpO3KxM1DfZXtqJdeVgtHjXlO7I3d77wq-TNNuO1TBLWi8unBJIBTzYvSuWUZwBg/exec',KEY='nawaf-2026-red';
const TRACKS=[['stem','🔬','العلوم والهندسة',27],['math','➗','الرياضيات',13],['ela','📚','الإنجليزية',14],['social','🌍','الاجتماعيات',8],['health','❤️','الصحة',4],['arabic','ع','العربية',8],['islamic','🕌','التربية الإسلامية',6]];
const TRACK_OF={};
// mission id -> track (kept in sync with the app)
'forces matter machines earth ecosystems coding design lifecycles traits fossils groups magnets climates hazards fairtest events daynight solar rockets satellites gears engineers plants animals lightsound rocks body'.split(' ').forEach(i=>TRACK_OF[i]='stem');
'multiply fractions area time measure graphs placevalue addsub multprops wordprob compfrac geometry lineplot'.split(' ').forEach(i=>TRACK_OF[i]='math');
'nounverb plurals tenses sentences punctuation prefixsuffix contextclues spelling storymap textfeatures mainidea comparecontrast paragraph poetry'.split(' ').forEach(i=>TRACK_OF[i]='ela');
'mapskills continents communities economics government timeline holidays saudigeo'.split(' ').forEach(i=>TRACK_OF[i]='social');
'nutrition hygiene safety sleepexercise'.split(' ').forEach(i=>TRACK_OF[i]='health');
'harakat shaddamadd sunmoon taa partsofspeech number sentence hamza'.split(' ').forEach(i=>TRACK_OF[i]='arabic');
'pillars wudu surahs seerah adab iman'.split(' ').forEach(i=>TRACK_OF[i]='islamic');
const NAMES={forces:'القوى والحركة',matter:'حالات المادة',machines:'الآلات البسيطة',earth:'الطقس والمناخ',ecosystems:'النظام البيئي',coding:'منطق البرمجة',design:'التصميم الهندسي',lifecycles:'دورات الحياة',traits:'الصفات',fossils:'الأحافير',groups:'العيش في مجموعات',multiply:'الضرب والقسمة',fractions:'الكسور',area:'المساحة والمحيط',time:'قراءة الساعة',measure:'الكتلة والحجم',graphs:'الرسوم البيانية',magnets:'المغناطيس',climates:'مناخات العالم',hazards:'مخاطر الطقس',fairtest:'الاختبار العادل',events:'الأحداث والمتغيرات',daynight:'الأرض والشمس والقمر',solar:'المجموعة الشمسية',rockets:'الصواريخ',satellites:'الأقمار الصناعية',gears:'التروس',engineers:'المهندسون',placevalue:'القيمة المكانية',addsub:'الجمع والطرح',multprops:'خصائص الضرب',wordprob:'المسائل اللفظية',compfrac:'مقارنة الكسور',geometry:'الأشكال',lineplot:'القياس',plants:'النباتات',animals:'مجموعات الحيوانات',lightsound:'الضوء والصوت',rocks:'الصخور',body:'جسم الإنسان',nounverb:'Nouns & Verbs',plurals:'Plurals',tenses:'Tenses',sentences:'Sentences',punctuation:'Punctuation',prefixsuffix:'Prefixes & Suffixes',contextclues:'Context Clues',spelling:'Spelling',storymap:'Reading Stories',textfeatures:'Non-fiction',mainidea:'Main Idea',comparecontrast:'Compare & Contrast',paragraph:'Writing',poetry:'Poetry',mapskills:'مهارات الخريطة',continents:'القارات',communities:'المجتمعات',economics:'الحاجات والمال',government:'القواعد والحكومة',timeline:'التاريخ السعودي',holidays:'المناسبات',saudigeo:'جغرافية المملكة',nutrition:'الغذاء الصحي',hygiene:'النظافة',safety:'السلامة',sleepexercise:'النوم والرياضة',harakat:'الحركات',shaddamadd:'الشدة والمد',sunmoon:'ال الشمسية والقمرية',taa:'التاء المربوطة',partsofspeech:'أقسام الكلام',number:'المفرد والمثنى والجمع',sentence:'الجملة',hamza:'الهمزة',pillars:'أركان الإسلام',wudu:'الوضوء والصلاة',surahs:'سور القرآن',seerah:'السيرة',adab:'الآداب',iman:'أركان الإيمان'};
const nm=id=>NAMES[id]||id;const ic={opened:'📂',lesson:'📖',sort:'🧩',quiz:'❓',complete:'🏁',daily:'🔥',test:'🎓',photo:'📷',writing:'✍️'};
async function load(){try{const r=await fetch(URL_+'?key='+KEY+'&t='+Date.now());const j=await r.json();if(!j.state){document.getElementById('greet').textContent='لم يبدأ نواف بعد.';return}render(j.state);document.getElementById('stat').textContent='آخر تحديث: '+new Date(j.state.savedAt||Date.now()).toLocaleString('ar-SA')}catch(e){document.getElementById('stat').textContent='تعذّر الاتصال. حاول لاحقاً.'}}
function render(st){const prog=st.progress||{};const ids=Object.keys(prog);const done=ids.filter(i=>prog[i].status==='completed');const xp=ids.reduce((a,i)=>a+(prog[i].xp||0),0);const mins=Math.round(Object.values(st.time||{}).reduce((a,b)=>a+b,0)/60);const streak=(st.daily||{}).streak||0;
  document.getElementById('greet').textContent=done.length===0?'نواف بدأ رحلته. تابعوه هنا!':`أنجز نواف ${done.length} مهمة من ٨٠ حتى الآن.`;
  document.getElementById('kpis').innerHTML=[[done.length+'/80','مهمة مكتملة'],[xp,'نقاط الخبرة'],[mins+' د','وقت التعلّم'],['🔥 '+streak,'سلسلة الأيام']].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  document.getElementById('tracks').innerHTML=TRACKS.map(([id,i,n,total])=>{const d=done.filter(x=>TRACK_OF[x]===id).length;const p=Math.round(d/total*100);const cert=(st.tests||[]).some(x=>x.track===id&&x.score/x.n>=0.8);return `<div class="track"><span class="ring" style="--p:${p}"><i>${i}</i></span><div><h3>${n} ${cert?'🎓':''}</h3><p>${d} من ${total} · ${p}٪</p></div></div>`}).join('');
  document.getElementById('badges').innerHTML=done.length?done.map(i=>`<span class="badge">🏅 ${nm(i)}</span>`).join(''):'<span class="note">لا أوسمة بعد.</span>';
  const L=(st.log||[]).slice(-25).reverse();document.getElementById('log').innerHTML=L.length?'<tr><th>الوقت</th><th>النشاط</th><th>المهمة</th><th>التفاصيل</th></tr>'+L.map(e=>`<tr><td>${new Date(e.t).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${ic[e.type]||''} ${e.type}</td><td>${nm(e.mod)}</td><td>${(e.detail||'').slice(0,60)}</td></tr>`).join(''):'<tr><td class="note">لا نشاط بعد.</td></tr>';
  const T=(st.tests||[]).slice().reverse();document.getElementById('tests').innerHTML=T.length?'<tr><th>التاريخ</th><th>المسار</th><th>النتيجة</th></tr>'+T.map(x=>{const p=Math.round(x.score/x.n*100);const tn=(TRACKS.find(t=>t[0]===x.track)||[,,x.track])[2];return `<tr><td>${new Date(x.t).toLocaleDateString('ar-SA')}</td><td>${tn}</td><td>${x.score}/${x.n} (${p}٪) ${p>=80?'<span class="tag done">معتمد</span>':'<span class="tag need">إعادة</span>'}</td></tr>`}).join(''):'<tr><td class="note">لا اختبارات بعد.</td></tr>';
  const P=(st.photos||[]).slice().reverse();document.getElementById('photos').innerHTML=P.length?P.map(p=>`<a href="${p.url}" target="_blank" rel="noopener"><img src="${p.thumb||''}" alt=""></a>`).join(''):'<span class="note">لا صور بعد.</span>';}
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
