:root{--red:#C8102E;--red-deep:#8E0B22;--black:#141215;--ink:#1E1B1F;--bg:#F8F4F3;--card:#fff;--muted:#6E6468;--line:#E9DEDF;--gold:#D4A937;--green:#2E8B57;--shadow:0 6px 18px rgba(20,18,21,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#141215;--card:#211D21;--ink:#F4EDEE;--muted:#B4A6AA;--line:#3A3237}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Fredoka",system-ui,sans-serif;font-size:16px;line-height:1.55}
.top{background:var(--black);color:#fff;padding:14px 0}.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:0}.avatar{width:56px;height:56px;border-radius:50%;border:3px solid var(--red);object-fit:cover}
h1{font-size:1.4rem;margin:0}h1 small{display:block;font-size:.72rem;letter-spacing:.06em;color:#D9CFD2}
h2{font-size:1.15rem;margin:24px 0 8px}.note{color:var(--muted);font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.kpi b{display:block;font-size:1.8rem;color:var(--red);font-variant-numeric:tabular-nums}.kpi span{font-size:.78rem;color:var(--muted);font-weight:800}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:600px){.tracks{grid-template-columns:repeat(4,1fr)}}
.track{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.ring{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0)}.ring i{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
.track h3{font-size:.95rem;margin:0}.track p{margin:0;font-size:.78rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:6px 10px;font-size:.85rem;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}th{font-size:.75rem;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs a{width:110px;height:110px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--card)}.thumbs img{width:100%;height:100%;object-fit:cover}
.status{font-size:.8rem;color:var(--muted);margin-top:6px}.cta{display:inline-block;margin-top:10px;background:var(--red);color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:800}
.tag{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--line)}.tag.done{background:#E4F3EA;color:var(--green)}.tag.need{background:#FBE7EA;color:var(--red)}
</style>

ents:'الأحداث والمتغيرات',daynight:'الأرض والشمس والقمر',solar:'المجموعة الشمسية',rockets:'الصواريخ',satellites:'الأقمار الصناعية',gears:'التروس',engineers:'المهندسون',placevalue:'القيمة المكانية',addsub:'الجمع والطرح',multprops:'خصائص الضرب',wordprob:'المسائل اللفظية',compfrac:'مقارنة الكسور',geometry:'الأشكال',lineplot:'القياس',plants:'النباتات',animals:'مجموعات الحيوانات',lightsound:'الضوء والصوت',rocks:'الصخور',body:'جسم الإنسان',nounverb:'Nouns & Verbs',plurals:'Plurals',tenses:'Tenses',sentences:'Sentences',punctuation:'Punctuation',prefixsuffix:'Prefixes & Suffixes',contextclues:'Context Clues',spelling:'Spelling',storymap:'Reading Stories',textfeatures:'Non-fiction',mainidea:'Main Idea',comparecontrast:'Compare & Contrast',paragraph:'Writing',poetry:'Poetry',spellingbee:'🐝 Spelling Bee',snakes:'🐍 سلم وثعبان التهجئة',balloon:'🎈 إنقاذ بالونات بَز',wordhive:'🟩 خلية الكلمات',cards:'🃏 أوراق نواف',timestables:'⚔️ جدول الضرب',sudoku:'🔢 سودوكو',mapskills:'مهارات الخريطة',continents:'القارات',communities:'المجتمعات',economics:'الحاجات والمال',government:'القواعد والحكومة',timeline:'التاريخ السعودي',holidays:'المناسبات',saudigeo:'جغرافية المملكة',nutrition:'الغذاء الصحي',hygiene:'النظافة',safety:'السلامة',sleepexercise:'النوم والرياضة',harakat:'الحركات',shaddamadd:'الشدة والمد',sunmoon:'ال الشمسية والقمرية',taa:'التاء المربوطة',partsofspeech:'أقسام الكلام',number:'المفرد والمثنى والجمع',sentence:'الجملة',hamza:'الهمزة',pillars:'أركان الإسلام',wudu:'الوضوء والصلاة',surahs:'سور القرآن',seerah:'السيرة',adab:'الآداب',iman:'أركان الإيمان'};

async function load(){try{const r=await fetch(URL_+'?key='+KEY+'&t='+Date.now());const j=await r.json();if(!j.state){document.getElementById('greet').textContent='لم يبدأ نواف بعد.';return}render(j.state);document.getElementById('stat').textContent='آخر تحديث: '+new Date(j.state.savedAt||Date.now()).toLocaleString('ar-SA')}catch(e){document.getElementById('stat').textContent='تعذّر الاتصال. حاول لاحقاً.'}}
function render(st){const prog=st.progress||{};const ids=Object.keys(prog);const done=ids.filter(i=>prog[i].status==='completed');const xp=ids.reduce((a,i)=>a+(prog[i].xp||0),0);const mins=Math.round(Object.values(st.time||{}).reduce((a,b)=>a+b,0)/60);const streak=(st.daily||{}).streak||0;
  document.getElementById('greet').textContent=done.length===0?'نواف بدأ رحلته. تابعوه هنا!':`أنجز نواف ${done.length} مهمة من ٨٠ حتى الآن.`;
  const B=st.bee;if(B&&B.words){const ks=Object.keys(B.words);const m=ks.filter(w=>B.words[w].box>=3).length;const r=[1,2,3].includes(B.round)?B.round:1;const L=B.lists||{};const total=r===1?((B.list&&B.list.length)||50):r===2?((L.r2&&L.r2.length)||50):((L.r3&&L.r3.length)||50);const pct=Math.min(100,Math.round(m/total*100));const d=Math.ceil((new Date((B.date||'2026-10-04')+'T08:00:00')-Date.now())/864e5);document.getElementById('bee').innerHTML=`<h2>🐝 مسابقة التهجئة</h2><div class="kpi"><b>${pct}٪</b><span>الجولة ${['١','٢','٣'][r-1]} · جاهزية نواف · ${m} كلمة متقنة من ${total}${d>0?' · باقي '+d+' يوم':d===0?' · المسابقة اليوم!':''}</span></div>`}
  document.getElementById('kpis').innerHTML=[[done.length+'/80','مهمة مكتملة'],[xp,'نقاط الخبرة'],[mins+' د','وقت التعلّم'],['🔥 '+streak,'سلسلة الأيام']].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  document.getElementById('tracks').innerHTML=TRACKS.map(([id,i,n,total])=>{const d=done.filter(x=>TRACK_OF[x]===id).length;const p=Math.round(d/total*100);const cert=(st.tests||[]).some(x=>x.track===id&&x.score/x.n>=0.8);return `<div class="track"><span class="ring" style="--p:${p}"><i>${i}</i></span><div><h3>${n} ${cert?'🎓':''}</h3><p>${d} من ${total} · ${p}٪</p></div></div>`}).join('');
  document.getElementById('badges').innerHTML=done.length?done.map(i=>`<span class="badge">🏅 ${nm(i)}</span>`).join(''):'<span class="note">لا أوسمة بعد.</span>';
  const L=(st.log||[]).slice(-25).reverse();document.getElementById('log').innerHTML=L.length?'<tr><th>الوقت</th><th>النشاط</th><th>المهمة</th><th>التفاصيل</th></tr>'+L.map(e=>`<tr><td>${new Date(e.t).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${ic[e.type]||''} ${e.type}</td><td>${nm(e.mod)}</td><td>${(e.detail||'').slice(0,60)}</td></tr>`).join(''):'<tr><td class="note">لا نشاط بعد.</td></tr>';
  const T=(st.tests||[]).slice().reverse();document.getElementById('tests').innerHTML=T.length?'<tr><th>التاريخ</th><th>المسار</th><th>النتيجة</th></tr>'+T.map(x=>{const p=Math.round(x.score/x.n*100);const tn=(TRACKS.find(t=>t[0]===x.track.replace('@4',''))||[])[2]?((TRACKS.find(t=>t[0]===x.track.replace('@4',''))||[])[2]+(x.track.endsWith('@4')?' (ص4)':'')):x.track;const _unused=(TRACKS.find(t=>t[0]===x.track)||[,,x.track])[2];return `<tr><td>${new Date(x.t).toLocaleDateString('ar-SA')}</td><td>${tn}</td><td>${x.score}/${x.n} (${p}٪) ${p>=80?'<span class="tag done">معتمد</span>':'<span class="tag need">إعادة</span>'}</td></tr>`}).join(''):'<tr><td class="note">لا اختبارات بعد.</td></tr>';
  const P=(st.photos||[]).slice().reverse();document.getElementById('photos').innerHTML=P.length?P.map(p=>`<a href="${p.url}" target="_blank" rel="noopener"><img src="${p.thumb||''}" alt=""></a>`).join(''):'<span class="note">لا صور بعد.</span>';}
load();setInterval(load,5*60*1000);
</script>
